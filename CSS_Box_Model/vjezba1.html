<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 300px;
        height: 300px;
        box-sizing: border-box;
      }
      .prvi {
        background-color: beige;
        border: 2px solid darkred;
        padding: 50px 60px;
        margin: 0 auto;
      }
      .drugi {
        background-color: cornflowerblue;
        margin: 20px 10px 5px 2px;
        border: 10px solid darkslategrey;
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <!--  BOX tehnika ima 3 elementa: -margin -padding -border 
          Margina je razmak izmedu dva bloka
          Padding je element u bloku
          Border je okvir bloka

          border: 2px solid black (2px debljina bordera, solid je tip linije, black je boja linije)
          border-radius: zaobljenost bloka 
          box-sizing: border-box; (da sadržimo veličinu bloka)

          margin: 20px 10px 15px 2px (smjer kazaljke na satu strane)
          margin:20px 10px (20px gore i dole, 10px desno i lijevo)
          -->

    <div class="prvi">
      <p>Ovo je prvi paragraf u prvom bloku.</p>
    </div>
    <div class="drugi"></div>
  </body>
</html>
