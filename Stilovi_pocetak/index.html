<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      h1 {
        background-color: beige;
      }
    </style>
  </head>
  <body>
    <!-- Tri su načina dodavanja CSS-a:
          -inline (najveći prioritet, u liniji s h1)
          -internal (drugi prioritet, unutar style-a)
          -external
          
        Ako zelimo koristiti Css, nakon <title> naredbe
        dodajemo <link> i pod href ./ -->

    <h1 style="color: coral">Naslov 1</h1>

    <h3 id="naslov2">Naslov 2</h3>
    <h3 class="naslov3">Naslov 3</h3>
    <h3 class="naslov3">Naslov 4</h3>
  </body>
</html>
