<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 300px;
        height: 300px;
      }
      .relative {
        background-color: darksalmon;
        position: relative;
      }
      .absolute {
        background-color: darkkhaki;
        position: absolute;
        margin-top: 50px;
        margin-left: 50px;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div class="relative">
      <div class="absolute"></div>
    </div>

    <!--                 POSITIONING
     
    static - default polozaj (ne treba dodatno dodavati)
    --------------------------------------------------------------
    relative - kada ga pomaknemo iz static box-a (NAJDONJI layer)
    absolute - gledamo kao koordinatni sustav
    fixed - cijelo vrijeme stoji na istom mjestu (npr. menu ili home icon)
    -->
  </body>
</html>
