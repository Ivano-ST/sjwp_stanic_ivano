<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tablice vjezba</title>
  </head>
  <body>
    <h1>Zadatak 1</h1>
    <table border="2" width="300" height="360">
      <tr style="text-align: center">
        <th>1</th>
        <th>2</th>
        <th>3</th>
        <th>4</th>
        <th>5</th>
        <th>6</th>
        <th>7</th>
      </tr>

      <!-- PONEDJELJAK -->
      <tr style="text-align: center">
        <td>OS</td>
        <td>DBP</td>
        <td>FIZ</td>
        <td>FIZ</td>
        <td colspan="2">HJ</td>
        <td>MU</td>
        <td>PON</td>
      </tr>

      <!-- UTORAK -->
      <tr style="text-align: center">
        <td colspan="2">SJiwp</td>
        <td rowspan="2">HJ</td>
        <td colspan="2">DBP</td>
        <td colspan="2">GR</td>
        <td rowspan="2">UTO</td>
      </tr>

      <tr style="text-align: center">
        <td colspan="2"></td>
        <td colspan="2">RM</td>
        <td colspan="2">OS</td>
      </tr>

      <!-- SRIJEDA -->
      <tr style="text-align: center">
        <td rowspan="2">Rm</td>
        <td rowspan="2">SRO</td>
        <td rowspan="2">NiOP</td>
        <td rowspan="2">VJ</td>
        <td colspan="2">PM</td>
        <td rowspan="2">TiZK</td>
        <td rowspan="2">SRI</td>
      </tr>
      <tr style="text-align: center">
        <td colspan="2">MU</td>
      </tr>

      <!-- ČETVRTAK -->
      <tr style="text-align: center">
        <td rowspan="2">EJ</td>
        <td rowspan="2">EJ</td>
        <td rowspan="2">MAT</td>
        <td>PMU</td>
        <td>PMU</td>
        <td colspan="2">NiOP</td>
        <td rowspan="2">ČET</td>
      </tr>

      <tr style="text-align: center">
        <td colspan="2">IZB_WD</td>
        <td colspan="2">SJiWP</td>
      </tr>

      <!-- PETAK   -->
      <tr style="text-align: center">
        <td></td>
        <td colspan="2">MAT</td>
        <td>EJ</td>
        <td>GR</td>
        <td>GR</td>
        <td>TiZK</td>
        <td>PET</td>
      </tr>
    </table>
  </body>
</html>
