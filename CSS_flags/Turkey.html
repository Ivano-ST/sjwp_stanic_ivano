<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #crvena {
        position: relative;
        background-color: red;
        width: 500px;
        height: 300px;
      }

      #zvijezda {
        position: absolute;
        width: 70px;
        height: 70px;
        background-color: white;
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        transform: rotate(+60deg);

        top: 120px;
        left: 265px;
      }
    </style>
  </head>
  <body>
    <div id="crvena"></div>
    <div id="zvijezda"></div>
  </body>
</html>
