<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vjezba</title>
  </head>
  <body style="background-color: lightyellow">
    <h1>Student Registration Form</h1>

    <form action="#" method="get"></form>

    <label for="name">Students name & surname:</label>
    <input type="name" /> <br /><br />

    <label for="father">Father's name:</label>
    <input type="father" /><br /><br />

    <label for="date">Date of birth:</label>
    <input type="date" name="date" id="date" /><br /><br />

    <label for="tel">Mobile no.:</label>
    <input type="tel" name="tel" id="tel" /><br /><br />

    <label for="mail">E-mail:</label>
    <input type="email" name="mail" id="mail" /><br /><br />

    <label for="pass">Password:</label>
    <input type="password" name="pass" id="pass" /><br /><br />

    Gender:
    <input type="radio" name="g1" id="man" />
    <label for="man">Male</label>
    <input type="radio" name="g1" id="women" />
    <label for="women">Female</label><br /><br />

    Department:
    <input type="checkbox" name="d1" id="it" />
    <label for="it">IT</label>
    <input type="checkbox" name="d2" id="cse" />
    <label for="cse">CSE</label><br /><br /><br />

    Course:
    <select name="course" id="course">
      <option value="Electrician">Electrician</option>
      <option value="Mechanic">Mechanician</option></select
    ><br /><br />

    Adress: <br /><br />
    <textarea name="adress" id="adress" rows="4" cols="40"></textarea>
    <br /><br />

    <input type="submit" value="Završi" />
  </body>
</html>
