<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout page</title>
  </head>
  <body style="background-color: gainsboro">
    <form action="#" method="get">
      <h1 style="font-family: monospace; font-size: 500%; text-align: center">
        Checkout Page
      </h1>
      <!--  NAME  -->
      <label
        for="name"
        style="
          font-family: sans-serif;
          position: fixed;
          left: 5%;
          top: 18%;
          font-size: 200%;
        "
        >Name:</label
      >

      <input
        type="name"
        required
        style="position: fixed; left: 12%; top: 18%; font-size: 150%"
      />
      <br /><br />

      <!--  SURNAME -->
      <label
        for="surname"
        style="
          font-family: sans-serif;
          position: fixed;
          left: 5%;
          top: 24%;
          font-size: 200%;
        "
        >Surname:</label
      >

      <input
        type="surname"
        style="
          font-family: sans-serif;
          position: fixed;
          left: 14%;
          top: 24%;
          font-size: 150%;
        "
      />
      <br /><br />

      <!--  E-MAIL  -->
      <label
        for="email"
        style="
          font-family: sans-serif;
          position: fixed;
          left: 5%;
          top: 30%;
          font-size: 200%;
        "
        >E-mail:</label
      >
      <input
        type="email"
        name="email"
        id="email"
        style="
          font-family: sans-serif;
          position: fixed;
          left: 12%;
          top: 30%;
          font-size: 150%;
        "
      />
      <br /><br />

      <!--  PASSWORD  -->
      <label
        for="password"
        style="
          font-family: sans-serif;
          position: fixed;
          left: 5%;
          top: 36%;
          font-size: 200%;
        "
        >Password:</label
      >
      <input
        type="password"
        name="password"
        id="password"
        style="
          font-family: sans-serif;
          position: fixed;
          left: 14%;
          top: 36%;
          font-size: 150%;
        "
      />

      <!--  LINE  -->
      <hr
        style="
          width: 30%;
          height: 5px;
          background-color: darkolivegreen;
          border-color: black;
          border-width: 50%;
          position: fixed;
          left: 5%;
          top: 43%;
        "
      />

      <!--  COUNTRY -->
      <p
        style="
          font-family: sans-serif;
          position: fixed;
          left: 5%;
          top: 46%;
          font-size: 200%;
        "
      >
        Country:
      </p>

      <select
        name="country"
        id="country"
        style="position: fixed; left: 13%; top: 50%; font-size: 150%"
      >
        <option value="cro">Croatia</option>
        <option value="usa">United States of America</option>
        <option value="ger">Germany</option>
        <option value="mex">Mexico</option>
        <option value="rus">Russia</option>
      </select>

      <!--  CITY  -->
      <label
        for="city"
        style="
          font-family: sans-serif;
          position: fixed;
          left: 5%;
          top: 57%;
          font-size: 200%;
        "
        >City:</label
      >
      <input
        type="city"
        style="
          font-family: sans-serif;
          position: fixed;
          left: 10%;
          top: 57%;
          font-size: 150%;
        "
      />

      <!--  ADDRESS   -->
      <label
        for="address"
        style="
          font-family: sans-serif;
          position: fixed;
          left: 5%;
          top: 64%;
          font-size: 200%;
        "
        >Address:</label
      >

      <input
        type="address"
        size="30"
        style="
          font-family: sans-serif;
          position: fixed;
          left: 13%;
          top: 64%;
          font-size: 150%;
        "
      />

      <!--  SUBMIT  -->
      <input
        type="submit"
        value="Place an order"
        style="
          font-family: Helvetica;
          position: fixed;
          left: 13%;
          top: 78%;
          font-size: 230%;
        "
      />

      <!--  ORDER SUBMIT  -->

      <hr
        style="
          width: 0.4%;
          height: 65%;
          background-color: darkolivegreen;
          border-color: black;
          border-width: 50%;
          position: fixed;
          left: 50%;
          top: 18%;
        "
      />
      <img
        src="/Slike/Order summary.jpg"
        alt="pic1"
        style="position: fixed; left: 64%; top: 19%; height: 70%"
      />
    </form>
  </body>
</html>
