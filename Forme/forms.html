<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <h1>HTML Forme</h1>
    form
    <form action="#" method="get">
      <label for="name">Unesite ime:</label>
      <input
        type="text"
        id="name"
        placeholder="unesi ime..."
        size="25"
        maxlength="10"
        required
      /><br />
      <br />

      <label for="pass">Unesite lozinku:</label>
      <input type="password" name="pass" id="pass" /> <br /><br />

      <label for="mail">Unesite e-mail:</label>
      <input type="email" name="mail" id="mail" /><br /><br />

      <label for="date">Izaberi datum:</label>
      <input type="date" name="date" id="date" /><br /><br />

      <label for="color">Izaberite boju:</label>
      <input type="color" name="color" id="color" /><br /><br />

      <label for="file">Izaberite file:</label>
      <input type="file" name="file" id="file" /><br /><br />

      <label for="tel">Unesite broj telefona:</label>
      <input type="tel" name="tel" id="tel" /><br /><br />

      <p>Odaberi najbolji klub:</p>

      <input type="radio" name="klub" id="real" />
      <label for="real">Real Madrid</label><br />

      <input type="radio" name="klub" id="barca" />
      <label for="barca">Barcelona</label><br />

      <input type="radio" name="klub" id="marsa" />
      <label for="marsa">Marsonia</label><br />
      <br />

      <p>Odaberite sastojke:</p>
      <input type="checkbox" name="s1" id="kečap" />
      <label for="kečap">Kečap</label><br />

      <input type="checkbox" name="s2" id="majoneza" />
      <label for="majoneza">Majoneza</label><br /><br />

      <input type="reset" value="Obriši sve" />

      <br />
      <input type="submit" value="Završi" />
    </form>
  </body>
</html>
